# Audit 2026-09-15 (٧.ب): تحديثات تبعيات أسبوعية، بحدّ صغير للطلبات المفتوحة
# (المستودع يُصدر يدوياً — الحصة والمراجعة أهم من كثرة الـPRs).
#
# ملاحظة مهمة: لا يوجد `Cargo.toml` في جذر المستودع — حزمة Rust في `src-tauri/`،
# فـ`directory` لها يجب أن يكون `/src-tauri` (وإلا لن يجد dependabot شيئاً).
version: 2

updates:
  # Rust — يعالج أيضاً تبعيات tauri/ort/notify في src-tauri/Cargo.toml
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # 2026-09-15 (بعد أول تشغيل فتح تسعة طلبات دفعةً واحدة):
    # الترقيات الكبرى تُتجاهل لأنها تحتاج تعديل كود ومراجعة يدوية (notify 6→8 ·
    # sha2 0.10→0.11)، والدنيا والرقعة تُجمَّع في طلب واحد لكل نظام بدل طلب لكل
    # مكتبة. المشروع يُصدر يدوياً فالحصّة والمراجعة أهم من كثرة الطلبات.
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2026-09-15 (أ.٤): `semver-major` لا يوقف قفزات ما قبل الإصدار (rc)،
      # و`ort` هو محرّك الفصل: نسخة المزوّد (ort) يجب أن تطابق بناء ORT
      # المضمَّن 1.22.0 بدقّة، فقفزة rc.10→rc.13 تُسقط تسجيل المزوّد بصمت
      # (ROADMAP ٤.ب.١١ · cuda-assets.yml). يُرفع التجاهل عند 2.0.0 المستقر.
      - dependency-name: "ort"
        versions: ["<2.0.0"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # الواجهة والموقع — pnpm-lock.yaml في الجذر
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # نفس السياسة: لا طلبات لترقية كبرى (vite 6→8 · typescript 5.6→7 تحتاج
    # تعديل مسار البناء ومراجعة)، والدنيا والرقعة في طلب واحد.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # سير العمل نفسه (actions/checkout، tauri-action، rust-cache…)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # ترقيات الـactions تُدمج كمجموعة واحدة: تغييرها لا يمسّ التطبيق المبنّي،
    # فلا يستحق طلباً لكل action.
    groups:
      actions:
        patterns: ["*"]
    # 2026-09-15 (أ.٤): كانت هذه المجموعة بلا `ignore` أصلاً — فترقية كبرى
    # لـ`tauri-action` (0→1 تغيّر تسمية الأصول) تصل مدمَجة مع غيرها وتكسر مسار
    # النشر. التجاهل هنا يمنع الكبرى فقط، والدنيا/الرقعة تبقى في مجموعة واحدة.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
