name: Quality gate

# Wave 1 (1.5) — one workflow that runs the four checks from the release gate
# (ROADMAP §6.1): cargo test, cargo clippy (errors only), tsc, and the five
# site guards. No `-D warnings`: 11 clippy warnings remain, each a documented
# exception in docs/AUDIT.md (NaN-deliberate comparisons and two deferred refactors);
#
# Cost note: windows-latest runners bill at 2× minutes. This workflow does NOT
# build the installer (~650MB uploads) — it compiles the test/profile targets
# only, with the Rust cache warm after the first run.

on:
  workflow_dispatch:
  push:
  # 2026-09-15: بلا هذا المشغّل لا يفحص شيءٌ طلبات Dependabot (فُتحت تسعة مرة
  # واحدة) — كان الفحص يقع بعد الدمج لا قبله. معه تصير كل طلبات السحب مُبوَّبة.
  pull_request:
    branches:
      - main

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install

      # tauri-build validates bundle.resources paths (tauri.conf.json:54-58) BEFORE
      # compiling anything, and bin/ + models/ + vc_redist.x64.exe are gitignored —
      # so a clean runner dies with "resource path `..\bin` doesn't exist".
      # Stub them: this gate compiles and tests, it does not bundle.
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      # The separation-engine tests exercise the REAL MDX model (63.7MB, gitignored).
      # Fetch just the model — not the 434MB ffmpeg/ffprobe pair, whose tests skip
      # themselves when the tools are absent — so the heart of the product is
      # genuinely tested on every push instead of silently skipped.
      - name: Fetch the separation model
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p UVR-MDX-NET-Voc_FT.onnx -D models
          Get-Item models/UVR-MDX-NET-Voc_FT.onnx | ForEach-Object { "model: $($_.Length) bytes" }

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - name: Clippy (errors only)
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Settings parity guard
        run: pnpm settings:parity

      # بوابة الإصدار (ROADMAP §6.2): الإصدار مكتوب في أربعة ملفات، وأي انحراف
      # بينها يُنتج مثبّتاً يقول شيئاً ويحمل غيره. يفشل هذا الحارس عند أول اختلاف.
      - name: Version consistency guard
        run: pnpm versions:check

      - name: Site guards
        run: pnpm site:check
