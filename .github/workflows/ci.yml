name: Quality gate

# Wave 1 (1.5) — one workflow that runs the four checks from the release gate
# (ARCHIVE/ROADMAP.md §6.1): cargo test, cargo clippy (errors only), tsc, and the five
# site guards. No `-D warnings`: 11 clippy warnings remain, each a documented
# exception in docs/AUDIT.md (NaN-deliberate comparisons and two deferred refactors);
#
# Cost note: windows-latest runners bill at 2× minutes. This workflow does NOT
# build the installer (~650MB uploads) — it compiles the test/profile targets
# only, with the Rust cache warm after the first run.

on:
  workflow_dispatch:
    inputs:
      run_release_e2e:
        description: 'أضف بوابة E2E الكاملة (تنزيل ffmpeg/ffprobe ~434MB، +2-4 دقائق)'
        type: boolean
        default: false
  push:
  # 2026-09-15: بلا هذا المشغّل لا يفحص شيءٌ طلبات Dependabot (فُتحت تسعة مرة
  # واحدة) — كان الفحص يقع بعد الدمج لا قبله. معه تصير كل طلبات السحب مُبوَّبة.
  pull_request:
    branches:
      - main

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install

      # tauri-build validates bundle.resources paths (tauri.conf.json:54-58) BEFORE
      # compiling anything, and bin/ + models/ + vc_redist.x64.exe are gitignored —
      # so a clean runner dies with "resource path `..\bin` doesn't exist".
      # Stub them: this gate compiles and tests, it does not bundle.
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      # The separation-engine tests exercise the REAL MDX model (63.7MB, gitignored).
      # Fetch just the model — not the 434MB ffmpeg/ffprobe pair, whose tests skip
      # themselves when the tools are absent — so the heart of the product is
      # genuinely tested on every push instead of silently skipped.
      # ويُجلب بـ`fetch-resources.cjs` لا بـ`gh`: السكربت يتحقّق من **البصمة المثبَّتة في
      # `repair.rs`** قبل أن يعتمد الملف (والخطوة السابقة كانت تنزّل بلا تحقّق)، ويعمل
      # بلا رمز وصول — فيُجرَّب على كل دفعة بدل أن يعتق.
      - name: Fetch the separation model (verified against the pinned digest)
        run: node scripts/fetch-resources.cjs --only=UVR-MDX-NET-Voc_FT.onnx

      - name: Verify the fetched resources against their pinned digests
        run: pnpm verify:resources

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      # التنسيق بوابة لا نصيحة (سبرنت 0.2.7 · هـ-٥ جزء ١): الشجرة كانت **410 كتل فرق**
      # حتى أغلقها التزام تنسيق واحد لا يمسّ المنطق، وهذا السطر يمنع عودتها. (و«صفر
      # تحذيرات» و`-D warnings` موجة تالية — 10 تحذيرات قائمة لا تُصلَح في إصدار فيه منتج.)
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (errors only)
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # `tsc` يتحقّق من الأنواع ولا يبني الحزمة: تقسيم src/main.ts (البند ١٢) كشف
      # أن CI لم يُشغّل `vite build` ولا مرّة — فانكسار البناء (استيراد دائري،
      # وحدة مفقودة، خطأ Rollup) كان يمرّ أخضر. البناء هنا ~١ ثانية + tailwind
      # ~٠.٦ ثانية، ولا يحتوي fetch_redist.js كي لا ينزّل شيئاً في البوابة.
      - name: Frontend build (tailwind + vite)
        run: pnpm build:web

      # اختبارات الواجهة (سبرنت 0.2.7 · د-٩ + ج-١٠): عقد مصارف HTML (بيانات الخلف
      # والمسارات لا تمرّ كوسم) + وحدتان نقيتان (sanitizePath · outDirOf) + تكافؤ
      # مفاتيح الترجمة مع `index.html`. ٦٥ حالة في ٤ ملفات، وبلا اعتماديات نظام.
      # وهي بوابة الانحدار الوحيدة التي تلمس **سلوك** الواجهة: `tsc` يفحص الأنواع
      # و`build:web` يبني، ولا أحدهما يرى عطلاً سلوكياً في `src/`.
      - name: Frontend regression tests (vitest)
        run: pnpm test:web

      # حارس الهندسة (سبرنت 0.2.7 · ج-١): يقيس **كل** صندوق عائم في الـDOM الحيّ داخل
      # حدود النافذة — في `ltr` و`rtl` وعلى 820 (‏minWidth المعلن) و1084 و1920 — ويكشف
      # عدم التماثل بين الاتجاهين. وُلد من عطل حقيقي: لوحة الإعدادات كانت تخرج 208px
      # في الإنجليزية وحدها (‏`left-0` فيزيائية) والعربية سليمة. 18 صندوقاً في 6 حالات،
      # بلا اعتماديات npm (Chrome/Edge بلا واجهة عبر CDP).
      # **وموضعه هنا إلزامي**: يقيس `dist/` لا المصدر ⇒ لو ترك dist قديماً مرّ على واجهة
      # معطوبة (مُختبَر: تعديل المصدر بلا بناء ⇒ 0، وبعد البناء ⇒ 1). وهو يفشل بوضوح إن
      # غاب المتصفّح بدل أن يمرّ صامتاً.
      - name: Layout guard (headless geometry)
        run: node scripts/check-layout.cjs

      - name: Settings parity guard
        run: pnpm settings:parity

      # حارس مزامنة الإضافة (**355 فحصاً**) على `browser-extension/content.js`:
      # بوابة واحدة لكتابة موضع الصوت · منع السحب للخلف على صوت يعمل · الإجباريّ
      # بلا خيار · قرار الفجوة (`planGap`) · وضع التسريع · ومنع العود اللانهائي في
      # طبقة الأثر. كان يعمل يدوياً فقط؛ هذا السطر يجعله بوابةً على كل دفعة.
      # لا اعتماديات خارجية: Node + الملفات المشحونة وحدها.
      - name: Extension sync guard
        run: pnpm ext:guard

      # البوابة السلبية: ٢٧ مُفسَداً يُغيَّر بها سلوك الملف المشحون، وكل واحد **يجب**
      # أن يُسقط الحارس. حارس أخضر لا يعني أنه يرى — الدليل أن يسقط على نصّ مُخرَّب.
      # مُفسَد يمرّ = ثقب مؤكَّد، والأمر يفشل (exit 1) ويسمّيه.
      - name: Extension mutant gate (negative tests)
        run: pnpm ext:mutants

      # بوابة الإصدار (ARCHIVE/ROADMAP.md §6.2): الإصدار مكتوب في أربعة ملفات، وأي انحراف
      # بينها يُنتج مثبّتاً يقول شيئاً ويحمل غيره. يفشل هذا الحارس عند أول اختلاف.
      - name: Version consistency guard
        run: pnpm versions:check

      - name: Site guards
        run: pnpm site:check

  # ── Release gate (ARCHIVE/ROADMAP.md §٧.ب بند ٥ · §6) — workflow_dispatch ONLY ──
  #
  # Why a separate job instead of a step above: this is the one gate that needs
  # BOTH the model (63.7MB) and ffmpeg+ffprobe (~434MB). Fetching the tools on
  # every push would slow every commit for a check whose verdict only matters
  # before a release — the "gate" job above already runs the same engine E2E
  # assertions (`e2e_separation_is_measurable_on_generated_sample`) on every
  # push, because that one needs the model alone.
  #
  # Cost when triggered: ~2-4 min of a windows-latest runner (2× billed) plus
  # ~500MB of downloads. Cost when not triggered: zero — `push` does not run it.
  #
  # Manual run: Actions → "Quality gate" → Run workflow. The explicit `if`
  # below keeps a *plain* dispatch (no inputs) behaving exactly like `push`.
  e2e-release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_e2e == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources before compiling (see the gate job).
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      # The published tool assets are LGPL-named (ffmpeg-lgpl.exe/ffprobe-lgpl.exe);
      # they are staged under the names `media::resolve_tool` looks for.
      - name: Fetch model + ffmpeg/ffprobe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p UVR-MDX-NET-Voc_FT.onnx -D models
          $tools = Join-Path $env:RUNNER_TEMP 'e2e-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p ffmpeg-lgpl.exe  -O (Join-Path $tools 'ffmpeg.exe')
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p ffprobe-lgpl.exe -O (Join-Path $tools 'ffprobe.exe')
          Get-ChildItem $tools | ForEach-Object { "$($_.Name): $($_.Length) bytes" }

      # Runs BOTH E2E tests: the every-push one (no tools needed) and the
      # ffmpeg-driven full-pipeline one. `--ignored` runs only the ignored set,
      # so the engine test is selected by name explicitly.
      - name: Release E2E (generated sample through the real pipeline)
        working-directory: src-tauri
        env:
          HARAMLITE_TOOLS_DIR: ${{ runner.temp }}\e2e-tools
        run: |
          cargo test --lib e2e_separation_is_measurable_on_generated_sample -- --nocapture
          cargo test --lib e2e_full_pipeline_through_ffmpeg -- --ignored --nocapture
