name: Quality gate

# Wave 1 (1.5) — one workflow that runs the four checks from the release gate
# (ROADMAP §6.1): cargo test, cargo clippy (errors only), tsc, and the five
# site guards. No `-D warnings`: 57 pre-existing clippy warnings are scheduled
# for Wave 3, so denying warnings now would keep this red by design.
#
# Cost note: windows-latest runners bill at 2× minutes. This workflow does NOT
# build the installer (~650MB uploads) — it compiles the test/profile targets
# only, with the Rust cache warm after the first run.

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install

      # tauri-build validates bundle.resources paths (tauri.conf.json:54-58) BEFORE
      # compiling anything, and bin/ + models/ + vc_redist.x64.exe are gitignored —
      # so a clean runner dies with "resource path `..\bin` doesn't exist".
      # Stub them: this gate compiles and tests, it does not bundle (~515MB of
      # runtime assets are fetched by release.yml via fetch_redist.js instead).
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - name: Clippy (errors only)
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Settings parity guard
        run: pnpm settings:parity

      - name: Site guards
        run: pnpm site:check
