name: Quality gate

# Wave 1 (1.5) — one workflow that runs the four checks from the release gate
# (ARCHIVE/ROADMAP.md §6.1): cargo test, cargo clippy (errors only), tsc, and the five
# site guards. No `-D warnings`: 11 clippy warnings remain, each a documented
# exception in docs/AUDIT.md (NaN-deliberate comparisons and two deferred refactors);
#
# Cost note: windows-latest runners bill at 2× minutes. This workflow does NOT
# build the installer (~650MB uploads) — it compiles the test/profile targets
# only, with the Rust cache warm after the first run.

on:
  workflow_dispatch:
    inputs:
      run_release_e2e:
        description: 'أضف بوابة E2E الكاملة (تنزيل ffmpeg/ffprobe ~434MB، +2-4 دقائق)'
        type: boolean
        default: false
  push:
  # 2026-09-15: بلا هذا المشغّل لا يفحص شيءٌ طلبات Dependabot (فُتحت تسعة مرة
  # واحدة) — كان الفحص يقع بعد الدمج لا قبله. معه تصير كل طلبات السحب مُبوَّبة.
  pull_request:
    branches:
      - main

# حِزام على مستوى السير (2026-09-25): بلا هذا المفتاح تتراكم تشغيلات مكرّرة — مقيس في
# السجلّ: أربعة تشغيلات بدأت في الثانية نفسها (2026-09-22T14:25) على فرعين (push وPR
# لكلٍّ). والمجموعة تحمل `github.workflow` لأن المستودع فيه أربعة سيرات، والوثائق تحذّر:
# «مجموعة غير مقيَّدة باسم السير تُلغي تشغيلات سير آخر» ⇒ فباسم السير **لا يمكن** أن
# يُلغي هذا المفتاح تشغيلاً جارياً لـ`release.yml` أو `cuda-assets.yml`.
#
# **والاستثناء على `main` مقصود ومُعلَن**: إلغاء تشغيل الفرع الرئيسي يمحو حُكم الالتزام
# السابق، فلا يُعرف بعدها أهو عطل جديد أم قديم؛ والدفعة القادمة (مقيس: ٢٤٩ التزاماً
# محلّياً فوق `origin/main`) تُنتج **تشغيلاً واحداً** لا ٢٤٩ ⇒ فالإلغاء على `main` لا
# يوفّر شيئاً هناك بينما يُتلف دليلاً. والتكرار المقيس محلّه فروع الطلبات، وهي تُلغى.
# (والصيغة الشرطية لـ`cancel-in-progress` هي عين ما توثّقه GitHub لهذا الغرض.)
#
# **وحدّ مُعلَن**: لأن `github.ref` في حدث `pull_request` هو `refs/pull/N/merge` وفي
# `push` هو `refs/heads/<الفرع>`، فإن تشغيلي الفرع الواحد (push + PR) **لا يُدمجان** —
# هذا المفتاح يُلغي التكرار **داخل المرجع نفسه** فقط.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: windows-latest
    # مهلة مُعلَنة بدل الافتراضية — والوثائق تقول حرفاً: `Default: 360` دقيقة، فعدّاء
    # يتعلّق يستهلك **ستّ ساعات** بلا أن يُسقط شيئاً.
    # **المقيس** (`gh api .../runs/<id>/jobs` على **المئة تشغيل الأحدث**: ٩٠ منها بمهمّة
    # `gate` ناجحة): زمن هذه المهمّة ٣٫٥٢–١٣٫٣٧ دقيقة، الوسيط ٥٫٤٣ ⇒ ٤٥ دقيقة هامشها ٣٫٤×
    # على أسوأ ما قيس.
    # **وحدّ القياس**: كل تلك التشغيلات كانت على نسخة هذا السير بـ**٢٩** خطوة مُسمّاة،
    # وهذه الشجرة فيها **٣٣**، منها **٧ لم تُشغَّل في CI ولا مرّة** (‏rust:gates ·
    # separation:entry · release:assets · redist:guard · release:parity ·
    # site:latest-trust · guards:selfcheck:all) ⇒ الهامش **مُعلَن لا مُدَّعى**.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 20 كان دون أرضية أدوات الاختبار: `jsdom@30` يعلن `engines: ^22.22.2 || ^24.15.0 || >=26`
      # و`undici@8` يطلب `>=22.19.0`، فكانت خطوة `vitest` تفشل بـ
      # `webidl.util.markAsUncloneable is not a function` — وقد ظهر ذلك في أول دفع بعد
      # توصيل البوّابة (2026-09-17) لا قبلها. (وعلى جهاز المالك Node 25 فالاختبارات تمرّ.)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install

      # tauri-build validates bundle.resources paths (tauri.conf.json:54-58) BEFORE
      # compiling anything, and bin/ + models/ + vc_redist.x64.exe are gitignored —
      # so a clean runner dies with "resource path `..\bin` doesn't exist".
      # Stub them: this gate compiles and tests, it does not bundle.
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      # The separation-engine tests exercise the REAL MDX model (63.7MB, gitignored).
      # Fetch just the model — not the 434MB ffmpeg/ffprobe pair, whose tests skip
      # themselves when the tools are absent — so the heart of the product is
      # genuinely tested on every push instead of silently skipped.
      # ويُجلب بـ`fetch-resources.cjs` لا بـ`gh`: السكربت يتحقّق من **البصمة المثبَّتة في
      # `repair.rs`** قبل أن يعتمد الملف (والخطوة السابقة كانت تنزّل بلا تحقّق)، ويعمل
      # بلا رمز وصول — فيُجرَّب على كل دفعة بدل أن يعتق.
      - name: Fetch the separation model (verified against the pinned digest)
        run: node scripts/fetch-resources.cjs --only=UVR-MDX-NET-Voc_FT.onnx

      # النطاق هنا **مقصود**، وقد فُرض بالقياس لا بالرأي: هذه المهمّة تجلب **النموذج وحده**
      # (‏`bin/` يبقى stubs)، فطلب التحقّق من ffmpeg/ffprobe/yt-dlp و16 ملف CUDA فيها
      # **بوّابة لا يمكن أن تنجح** — وهذا ما أثبته أول دفع بعد إضافتها (2026-09-17): رسبت
      # بـ«bin/ffmpeg.exe — مفقود» وأوقفت ما بعدها. فالتحقّق يطالب بما جُلب فعلاً.
      # ويبقى `pnpm verify:resources` **كاملاً** أمرَ المطوّر حيث `bin/` معمورة (وهو ما
      # يجعل سببه الأصلي صحيحاً)، ولا يُدَّعى أنه يعمل في CI بغير هذا النطاق.
      - name: Verify the fetched resources against their pinned digests
        run: node scripts/fetch-resources.cjs --verify-only --only=UVR-MDX-NET-Voc_FT.onnx

      # **رقمان كانا يُقالان بالعين صارا باباً يُغلق البناء** (تدقيق م٥ · 2026-09-21):
      # `cargo test` كان بلا أي قيد على العدد — فحذف اختبارات يمرّ أخضر و«٣٤٩ ناجحاً» يبقى
      # صحيحاً حتى اللحظة التي يكفّ فيها؛ و`clippy` بلا `-D warnings` — فتحذير جديد يمرّ أخضر.
      # وهذه البوّابة تقرأ الرقمين من تشغيل حقيقي وتقابلهما بخطّ أساس **مكتوب ومُراجَع**
      # (`qa/rust-baselines.json`): مواضع clippy الفريدة · صفر فاشل · والناجح لا يقلّ عن الأساس
      # · **وجرد أسماء الاختبارات** (اختبار غاب ⇒ يسقط · واختبار جديد ⇒ يُقبل بتصريح).
      # (و`--message-format=json` لأن عدّ أسطر المخرَج يضمّ سطرَي ملخّص cargo — خطأ مقيس.)
      - name: Rust baseline gate (test names, clippy positions and counts against a reviewed baseline)
        run: pnpm rust:gates

      # **البوّابة السلبية للجانب الرست** — نظير `pnpm ext:mutants` (دفعة البوّابات · 2026-09-24):
      # مُفسَدات رست كانت **موثَّقة في التقارير فقط** ولا تُشغَّل آلياً، أي أن كل «مُفسَد أثبت
      # أن الحارس يرى» كان **دعوى** لا شيء يعيد إنتاجها. المنهج: سجلّ ثلاثيات (ملف · تحويلة
      # نصّية مُعلَنة · اختبار يجب أن يسقط)، تُطبَّق في **نسخة مؤقّتة** ويُشترط **سقوط** الاختبار
      # المعنيّ؛ ولكل تحويلة **ضابط** على النسخة النظيفة (وإلا فسقوطٌ لا يُنسب للتحويلة)،
      # **وشجرة العمل لا تُمَسّ** (`git status` قبل/بعد — والوسخ الزائد عن وسخها فشل).
      #
      # **وموضعها هنا بالقياس لا بالذوق**: هدف التصريف `src-tauri/target` صار **دافئاً** من
      # الخطوة السابقة (‏`rust:gates` يشغّل `cargo test` كاملاً)، فالبوّابة **تعيد استعمال** ما
      # بُني ولا تصرّف الحزمة من الصفر. **الكلفة المقيسة محلياً: ١٥٣ ث لثلاث تحويلات**
      # (نسخ البيئة ٨٨ ث · أوّل ربط ٢٤ ث · ثم ~١٠ ث للتحويلة) — أي دون حدّ الخمس دقائق.
      # **وحدّها المُعلَن**: ٣ تحويلات، وكل تحويلة إضافية ~١٠ ث.
      - name: Rust mutant gate (a declared mutation must fail its named test)
        run: pnpm rust:mutants --target src-tauri/target

      # التنسيق بوابة لا نصيحة (سبرنت 0.2.7 · هـ-٥ جزء ١): الشجرة كانت **410 كتل فرق**
      # حتى أغلقها التزام تنسيق واحد لا يمسّ المنطق، وهذا السطر يمنع عودتها.
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # بوابات الاعتماديات (سبرنت 0.2.7 · د-١ · د-٢): رخص · نسخ مكرّرة · مصادر · وتنبيهات
      # أمنية. والإعداد في `deny.toml` **مشتقّ من الرسم الفعلي** (597 حزمة)، و`advisories`
      # تفشل على **كل** ثغرة بلا اعتبار للدرجة (v2 أزال `severity-threshold`).
      # والاستثناءات السبعة فيه كلها `unmaintained`/`unsound` **بلا ترقية آمنة**، ومُثبَت
      # بالمُفسِد أن إرجاع `rustls` إلى 0.23.43 يُسقط البوابة رغمها — أي أنها ضيّقة لا مُرخاة.
      #
      # **ولماذا لا يُستعمل `EmbarkStudios/cargo-deny-action`**: هو إجراء **حاوية Docker**
      # و«Container action is only supported on Linux» — وهذه المهمّة على ويندوز، فكانت
      # الخطوة تفشل **قبل أن تفحص شيئاً**. (لم يُرَ ذلك إلا في أول دفع بعد توصيلها،
      # 2026-09-17.) فنجلب الثنائي الرسمي لويندوز بـ`gh` — كما تفعل مهمّة e2e أصلاً —
      # **بلا اعتمادية جديدة**، ونثبّت إصداره، ونتحقّق من بصمته قبل تشغيله.
      # (والبصمة من النشرة نفسها ⇒ فحص سلامة نقل لا مرجع ثقة مستقل — كحال مانيفست الأصول.)
      - name: Dependency gates (licences · bans · sources · advisories)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver   = '0.20.2'
          $asset = "cargo-deny-$ver-x86_64-pc-windows-msvc.tar.gz"
          $dir   = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $ver --repo EmbarkStudios/cargo-deny -p $asset -p "$asset.sha256" -D $dir --clobber
          $want = (Get-Content (Join-Path $dir "$asset.sha256") -Raw).Trim().Split()[0].ToLower()
          $got  = (Get-FileHash (Join-Path $dir $asset) -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "cargo-deny digest mismatch: $got != $want" }
          tar -xzf (Join-Path $dir $asset) -C $dir
          $deny = (Get-ChildItem $dir -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1).FullName
          & $deny --version
          & $deny --all-features --manifest-path src-tauri/Cargo.toml --config deny.toml check

      # إسناد الإصدار (سبرنت 0.2.7 · ب-٢): يولّد `build-info.json` و SBOM بصيغة CycloneDX
      # من الرسم المقيس (‏597 حزمة Cargo + 207 npm). ويفشل — **ولا يكتب شيئاً** — إن اختلف
      # الإصدار بين الملفات الأربعة، لأن ملف إسناد يحمل إصداراً غير الذي يُبنى كذب.
      # (وفي النشر يُشغَّل **بعد الوسم** ثم يُرفع الملفان مع الأصول — انظر `docs/CONTRIBUTING.md`.)
      - name: Release metadata (build-info · SBOM)
        run: pnpm build:info

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # `tsc` يتحقّق من الأنواع ولا يبني الحزمة: تقسيم src/main.ts (البند ١٢) كشف
      # أن CI لم يُشغّل `vite build` ولا مرّة — فانكسار البناء (استيراد دائري،
      # وحدة مفقودة، خطأ Rollup) كان يمرّ أخضر. البناء هنا ~١ ثانية + tailwind
      # ~٠.٦ ثانية، ولا يحتوي fetch_redist.js كي لا ينزّل شيئاً في البوابة.
      - name: Frontend build (tailwind + vite)
        run: pnpm build:web

      # اختبارات الواجهة (سبرنت 0.2.7 · د-٩ + ج-١٠): عقد مصارف HTML (بيانات الخلف
      # والمسارات لا تمرّ كوسم) + وحدتان نقيتان (sanitizePath · outDirOf) + تكافؤ
      # مفاتيح الترجمة مع `index.html`. ٦٥ حالة في ٤ ملفات، وبلا اعتماديات نظام.
      # وهي بوابة الانحدار الوحيدة التي تلمس **سلوك** الواجهة: `tsc` يفحص الأنواع
      # و`build:web` يبني، ولا أحدهما يرى عطلاً سلوكياً في `src/`.
      - name: Frontend regression tests (vitest)
        run: pnpm test:web

      # حارس الهندسة (سبرنت 0.2.7 · ج-١): يقيس **كل** صندوق عائم في الـDOM الحيّ داخل
      # حدود النافذة — في `ltr` و`rtl` وعلى 820 (‏minWidth المعلن) و1084 و1920 — ويكشف
      # عدم التماثل بين الاتجاهين. وُلد من عطل حقيقي: لوحة الإعدادات كانت تخرج 208px
      # في الإنجليزية وحدها (‏`left-0` فيزيائية) والعربية سليمة. 18 صندوقاً في 6 حالات،
      # بلا اعتماديات npm (Chrome/Edge بلا واجهة عبر CDP).
      # **وموضعه هنا إلزامي**: يقيس `dist/` لا المصدر ⇒ لو ترك dist قديماً مرّ على واجهة
      # معطوبة (مُختبَر: تعديل المصدر بلا بناء ⇒ 0، وبعد البناء ⇒ 1). وهو يفشل بوضوح إن
      # غاب المتصفّح بدل أن يمرّ صامتاً.
      - name: Layout guard (headless geometry)
        run: node scripts/check-layout.cjs

      - name: Settings parity guard
        run: pnpm settings:parity

      # حارس مزامنة الإضافة على `browser-extension/content.js`:
      # بوابة واحدة لكتابة موضع الصوت (**البنية** و**السلوك معاً**) · منع السحب للخلف على
      # صوت يعمل · الإجباريّ بلا خيار · قرار الفجوة (`planGap`) · وضع التسريع · طبقة
      # الأثر · ومسح بنية الإسناد على العنصرين (لا العدّ النصّي). كان يعمل يدوياً فقط؛
      # هذا السطر يجعله بوابةً على كل دفعة. لا اعتماديات خارجية: Node + الملفات المشحونة.
      - name: Extension sync guard
        run: pnpm ext:guard

      # البوابة السلبية: كل مُفسَد يُغيَّر به سلوك الملف المشحون، وكل واحد **يجب** أن
      # يُسقط الحارس. حارس أخضر لا يعني أنه يرى — الدليل أن يسقط على نصّ مُخرَّب.
      # مُفسَد يمرّ = ثقب مؤكَّد، والأمر يفشل (exit 1) ويسمّيه.
      # وخارج هذا الملف ١١٧ مُفسَداً مُضمَّناً في أقسام الحارس نفسه بالمنهج ذاته.
      - name: Extension mutant gate (negative tests)
        run: pnpm ext:mutants

      # بوابة الإصدار (ARCHIVE/ROADMAP.md §6.2): الإصدار مكتوب في أربعة ملفات، وأي انحراف
      # بينها يُنتج مثبّتاً يقول شيئاً ويحمل غيره. يفشل هذا الحارس عند أول اختلاف.
      - name: Version consistency guard
        run: pnpm versions:check

      # البوّابة التي ليست في CI ليست بوابة (AGENT.md §١٠): صفوف المصفوفة اليدوية
      # الإلزامية (20 صفّاً) يجب أن يحمل كلٌّ منها **تاريخاً وجهازاً ونتيجة** في
      # خانته الأخيرة. تفشل عند صفّ ناقص، وعند فقد بنية الوسم [إلزامي]، وعند
      # غياب الملف — لأن «حارساً لا يرى» ليس حارساً. والأداة تقيس وجود السجلّ لا
      # صدق المُختبِر («لم يُنفَّذ» نتيجة مسجَّلة مقبولة).
      #
      # و`✅` في صفّ «قابل للتقييم» مقيَّد بـ**أثر مُقيِّم** (`qa/eval/out/<رقم>.json`)
      # مُسند إلى التزام سلف ومنطقة صفّه لم تتغيّر بعده. وهذا العدّاء **لا يستطيع**
      # إنتاج آثار (‏`bin/` و`models/` stubs فوق) ⇒ يعمل هنا في الوضع الافتراضيّ
      # الذي يتسامح مع **غياب** الأثر وحده ويطبع سطراً صارخاً بذلك، **ويفشل على
      # الأثر البائت أو المخالف**. والقبول النهائي قبل أي نسخة تُسلَّم يشترط
      # `--require-artifacts` على جهاز فيه الأدوات (انظر `qa/eval/README.md`).
      - name: Manual test matrix (every mandatory row carries a record)
        run: node scripts/matrix-check.cjs --quiet

      # حارس **مدخل الفصل الواحد** (سبرنت 0.2.9 التحضيري): الحماية القادمة — محدِّد
      # فتحات الفصل عبر العمليات — تقوم كلها على أن **كل** مداخل الفصل تمرّ عبر غلاف
      # واحد. واليوم سبعة مواضع تنادي `pipeline::process_file` مباشرة في ستّة ملفات.
      # الحارس يقرأ المصادر **بعد نزع التعليقات** ويقابل كل ملف بقائمة مسموحة صريحة
      # (ملف + عدد متوقَّع)، فيمنع الثامن بلا إعلان. ويفشل بصوت عالٍ (exit 2) على
      # «صفر موضع» أو مجلد مصادر مفقود — «صفر مدخل ليس نجاحاً». بلا اعتماديات.
      - name: Separation entry guard (one entry, one wrapper)
        run: pnpm separation:entry

      - name: Site guards
        run: pnpm site:check

      # ── بوّابات دَين 0.2.8 التشغيلي (ن-١ · ن-٢ · ن-٥ · ن-٦ — خطة 0.2.9 §١١) ──
      # كلٌّ يقيس ما لا يقيسه غيره، وكلٌّ فيه مُفسَد يُسقطه وضابط يمرّ عليه:
      #   · ن-١ قناة الإصلاح الحيّة: **مسودّة** أو **404** أو **بصمة مخالفة** تُسقط
      #     البوّابة في الوضعين — وهو عطل 0.2.8 نفسه (قناة مسودّة بصفر أصول ⇒ روابط
      #     404 ⇒ الإصلاح الذاتي معطّل عند كل مستخدم مثبَّت، ولا شيء كان يسقط).
      #     وتحتاج الشبكة، فالغياب **البيئيّ** وحده (لا شبكة · مهلة · حدّ معدّل) سطر
      #     صارخ ولا يُسقط؛ و`GH_TOKEN` يرفع حدّ المعدّل من 60 إلى 5000 في الساعة.
      #   · ن-٢ بصمة الملف **الموجود** قبل البناء (كانت تُفحَص عند التنزيل فقط).
      #   · ن-٥ تكافؤ أصول الإصدار: **٥** لا ٣ — بقراءة ما يرفعه `release.yml` فعلاً.
      #   · ن-٦ الموقع لا يثق بـ`latest`: وسم غير دلالي لا يُعرض إصداراً.
      - name: Repair channel gate (assets-v1 is public, not a draft, every asset answers 200)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:assets

      - name: Redist digest guard (an existing file is hashed, never trusted)
        run: pnpm redist:guard

      - name: Release asset parity guard (five assets, not three)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:parity

      - name: Site latest-trust guard (a non-semver tag is ignored, not shown)
        run: pnpm site:latest-trust

      # البوّابة الخامسة عشرة: تحرس الحرّاس أنفسهم. ثمانية حرّاس كانوا يمرّون على
      # مدخل فارغ، أو ينهارون بدل تسمية الرمز المفقود، أو يُصنّفون انهيار الحارس
      # اصطياداً. هذه البوّابة تبني لكل حارس بيئةً مصنوعة تحت %TEMP% فيها **مُفسَد**
      # (يجب أن يُسقطه) و**ضابط** (يجب أن يمرّ عليه وقد رأى مدخلاً غير صفري)
      # و**صفر مدخل** (يجب أن يفشل بصوت عالٍ). تفشل إن مرّ مُفسَد أو فشل ضابط.
      # لا اعتماديات خارجية: Node + git، وخادم المعاينة على منفذ 0 يُوقَف بعد القياس.
      #
      # و`guards:selfcheck:all` يضمّ إلى الحارسة العامة **الفحوص الذاتية للحرّاس الذين
      # يحملونها داخلياً**: بوّابة قناة الإصلاح · الجالب · تكافؤ أصول الإصدار · ثقة
      # الموقع بـ`latest` · بوّابة المصفوفة (٢٧ حالة، ومقيس أنها تمرّ **بلا ثنائي
      # وبلا آثار** فلا تصلح عذراً لعدّاء CI). وبهذا لا يبقى حارسٌ في المستودع
      # بمُفسَدات لا تُشغَّل في أي مكان.
      - name: Guard self-check gate (mutant + control per guard, generic and internal)
        run: pnpm guards:selfcheck:all

  # ── Release gate (ARCHIVE/ROADMAP.md §٧.ب بند ٥ · §6) — workflow_dispatch ONLY ──
  #
  # Why a separate job instead of a step above: this is the one gate that needs
  # BOTH the model (63.7MB) and ffmpeg+ffprobe (~434MB). Fetching the tools on
  # every push would slow every commit for a check whose verdict only matters
  # before a release — the "gate" job above already runs the same engine E2E
  # assertions (`e2e_separation_is_measurable_on_generated_sample`) on every
  # push, because that one needs the model alone.
  #
  # Cost when triggered: ~2-4 min of a windows-latest runner (2× billed) plus
  # ~500MB of downloads. Cost when not triggered: zero — `push` does not run it.
  #
  # Manual run: Actions → "Quality gate" → Run workflow. The explicit `if`
  # below keeps a *plain* dispatch (no inputs) behaving exactly like `push`.
  e2e-release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_e2e == 'true' }}
    runs-on: windows-latest
    # المهلة الأطول (٦٠): هذه المهمّة وحدها تنزّل النموذج **و** ffmpeg/ffprobe
    # (~٥٠٠ ميغابايت) ثم تُصرّف أهداف الاختبار — أثقل ما في هذا السير.
    # **وهي لم تُشغَّل قطّ**: من ١٠٩ تشغيلات، صفر حمل هذه المهمّة (كلّها `skipped`،
    # **ولا تشغيل `workflow_dispatch` واحد** في السجلّ كلّه) ⇒ هذا **تقدير مُعلَن
    # لا قياس**. ومرجعه المقيس من سير آخر لا من هذا: مهمّة `build` في `release.yml`
    # (بناء المثبّت كاملاً) قِيست ١٥٫٠٥ و١٩٫٩٥ و١٦٫١٣ و١٩٫٦٨ و١٥٫٠٥ دقيقة في نجاحاتها،
    # **وفشلٌ واحد امتدّ ١٣٥٫٥ دقيقة** — وهذا الفشل الممتدّ هو بعينه ما تُغلقه المهلة.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources before compiling (see the gate job).
      - name: Stub bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, models | Out-Null
          New-Item -ItemType File -Force -Path bin/.stub, models/.stub | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/vc_redist.x64.exe | Out-Null

      # The published tool assets are LGPL-named (ffmpeg-lgpl.exe/ffprobe-lgpl.exe);
      # they are staged under the names `media::resolve_tool` looks for.
      - name: Fetch model + ffmpeg/ffprobe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p UVR-MDX-NET-Voc_FT.onnx -D models
          $tools = Join-Path $env:RUNNER_TEMP 'e2e-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p ffmpeg-lgpl.exe  -O (Join-Path $tools 'ffmpeg.exe')
          gh release download assets-v1 -R $env:GITHUB_REPOSITORY -p ffprobe-lgpl.exe -O (Join-Path $tools 'ffprobe.exe')
          Get-ChildItem $tools | ForEach-Object { "$($_.Name): $($_.Length) bytes" }

      # Runs BOTH E2E tests: the every-push one (no tools needed) and the
      # ffmpeg-driven full-pipeline one. `--ignored` runs only the ignored set,
      # so the engine test is selected by name explicitly.
      - name: Release E2E (generated sample through the real pipeline)
        working-directory: src-tauri
        env:
          HARAMLITE_TOOLS_DIR: ${{ runner.temp }}\e2e-tools
        run: |
          cargo test --lib e2e_separation_is_measurable_on_generated_sample -- --nocapture
          cargo test --lib e2e_full_pipeline_through_ffmpeg -- --ignored --nocapture
