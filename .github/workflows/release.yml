name: Release

# Sprint C3 — builds the NSIS installer + updater artifacts (latest.json + .sig)
# and publishes the self-repair assets (bin/*.exe, models/*.onnx) used by the
# in-app repair wizard (repair.rs → assets-v1 release).
#
# Secrets required in repo settings:
#   TAURI_SIGNING_PRIVATE_KEY          → content of the local `updater.key`
#   (optional) TAURI_SIGNING_PRIVATE_KEY_PASSWORD → only if a password was set
#
# ⚠ The updater.key file is gitignored — never commit it.

# ── Tag trigger DISABLED on purpose (2026-09-11) ────────────────────────────
# The GitHub account ran out of Actions storage (90% used), and this workflow
# uploads ~650MB of installers per run. Releases are therefore built and
# published locally (`pnpm tauri build` + `gh release create`) and this runs
# only when a human asks for it from the Actions tab.
#
# To restore automatic releases once the quota allows it, put this back:
#
#   push:
#     tags:
#       - 'v*'
#
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install

      - name: Download VC++ redist (bundled into installer)
        run: pnpm exec node ./scripts/fetch_redist.js

      # خطوة التحقّق قبل البناء (ن-٢ في خطة 0.2.9 §١١): البصمة تُقاس من **القرص**
      # بعد الجلب، ولا تنزيل ولا كتابة. فالعطل الأصلي كان أن الجالب يفحص الوجود
      # **قبل** البصمة ⇒ ملف موجود (ذاكرة عدّاء، نسخ يدوي، تنزيل منقطع) يُشحن بلا
      # قراءة بصمة، والتطبيق يرفض تلك البايتات فينكسر الإصلاح الذاتي بصمت.
      - name: Verify bundle resources before the build (digests, no download)
        run: pnpm exec node ./scripts/fetch_redist.js --verify

      - name: Build & publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TEMPORARY (user decision 2026-09-05): signing deferred — the secret
          # is not set yet AND an empty string makes the signer fail decoding
          # ("Missing comment in secret key"), so the line is removed entirely,
          # not left empty. Restore both lines when the secret is added:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'HaramLite v__VERSION__'
          releaseBody: 'التثبيت عبر NSIS. النسخة المحمولة لا تدعم التحديث الذاتي — استخدم صفحة الإصدارات.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          # TEMPORARY (user decision 2026-09-05): updater signing deferred —
          # TAURI_SIGNING_PRIVATE_KEY is not set yet, so skip updater artifacts
          # to keep releases green. Revert (delete this line) when the secret
          # is added; the in-app updater UI already degrades gracefully.
          includeUpdaterJson: false

      # ── ن-٣: دلّالات ORT لا تعود إلى حزمة MSI ─────────────────────────────
      # العطل المقيس (0.2.7 و0.2.8): MSI كان يحمل 199,942,176 بايت من دلّالات
      # ORT/DirectML (‏`onnxruntime_providers_cuda.dll` 180,731,904 + `_shared`
      # 10,752 + `_tensorrt` 671,744 + `DirectML.dll` 18,527,776) ببصمة مخالفة
      # للثابت المثبَّت في التطبيق — مصدرها `copy-dylibs` في اعتماد `ort`، ومولّد
      # WiX يحصد كل DLL بجوار التنفيذي. والخطوة تقيس **المولَّد فعلاً** في هذا
      # التشغيل (‏`main.wxs`)، لا نيّة في ملف: بعد البناء وقبل أي تشغيل للتطبيق
      # — لأن التطبيق نفسه ينسخ مكتبتَي الجسر المثبَّتتين إلى مجلد التنفيذي عند
      # تشغيله (‏`heal_provider_dlls_in`)، فقياسٌ بعد تشغيل لا يقول شيئاً عن البناء.
      # ومصدر السبب الجذري محروس أيضاً: اعتماد `ort` في Cargo.toml (يفشل بصوت عالٍ).
      #
      # **حدّ معلَن**: الخطوة بعد `tauri-action` (الذي يبني **وينشر**) — فهي تُحمّر
      # التشغيل وتكشف العودة، لكنها لا تمنع نشر أصل سيئ في تلك اللحظة؛ ومنعُه يحتاج
      # فصل البناء عن النشر (خارج نطاق ن-٣). ومسار البناء المحلي (`pnpm tauri build`)
      # لا يمرّ بهذه الخطوة أصلاً — حارسه `mod packaging_guard` في `cargo test`.
      - name: Guard — no ORT/DirectML DLLs in the bundled MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $ortLine = ($cargo -split "`n" | Where-Object { $_.TrimStart().StartsWith('ort =') }) -join ' '
          if (-not $ortLine) { throw 'لا سطر اعتماد ort في Cargo.toml — الحارس لا يرى' }
          if ($ortLine -notmatch 'default-features\s*=\s*false') {
            throw "اعتماد ort بلا default-features=false ⇒ copy-dylibs تعود فتُشحن دلّالات ORT في MSI: $ortLine"
          }
          if ($ortLine -match 'copy-dylibs') { throw "copy-dylibs مُعلَنة صراحةً: $ortLine" }
          foreach ($f in @('std','tracing','download-binaries','directml','cuda')) {
            if ($ortLine -notmatch [regex]::Escape($f)) { throw "ميزة $f مفقودة من اعتماد ort: $ortLine" }
          }
          $wxs = 'src-tauri/target/release/wix/x64/main.wxs'
          if (-not (Test-Path $wxs)) { throw "$wxs غير موجود — حزمة MSI لم تُولَّد فلا يُقاس محتواها (لا مرور صامت)" }
          $text = Get-Content $wxs -Raw
          $bad = @('onnxruntime_providers_cuda.dll','onnxruntime_providers_shared.dll','onnxruntime_providers_tensorrt.dll','DirectML.dll','onnxruntime.dll')
          $hit = @($bad | Where-Object { $text.Contains($_) })
          if ($hit.Count -gt 0) { throw "مولّد MSI يحصد دلّالات ORT: $($hit -join ' · ') — راجع src-tauri/Cargo.toml" }
          $files = @([regex]::Matches($text, '<File ')).Count
          Write-Host "✓ main.wxs بلا دلّالات ORT ($files سطر File مقيس)"

      # ── تكافؤ أصول الإصدار (ن-٥ في خطة 0.2.9 §١١) ──────────────────────────
      # المقيس بـ`gh release view --json assets`: v0.2.7 نُشرت بـ**٥** أصول وv0.2.8
      # بـ**٣** — `build-info.json` و`sbom.cdx.json` كانا يُرفعان **يدوياً** من جهاز
      # المالك (docs/CONTRIBUTING.md · إصدار جديد) فسقطا بالنسيان، و`SHA256SUMS.txt`
      # لم يكن هذا السير ينتجه أصلاً. والخطوتان التاليتان ترفعان الثلاثة من **نفس
      # التشغيل**، وتفشلان بصوت عالٍ — لأن خطوة pwsh **لا تفشل وحدها إذا فشل أمرها**
      # (عطل ن-١ نفسه: `$ErrorActionPreference` لا يكفي للأوامر الأصلية فيُفحَص
      # `$LASTEXITCODE` صراحةً بعد كل أمر حسّاس).
      # ويقيس ما يرفعه هذا الملف فعلاً: `scripts/check-release-parity.cjs` (المطلوب ٥).
      - name: Release metadata (build-info · SBOM) for the published tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          # الوسم يُجلب قبل التوليد: `build-info.json` يقرأه بـ`git describe --tags
          # --exact-match`، وبلا هذا الجلب يكتب git_tag = null (صادقاً لكنه غير مفيد).
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw "git fetch --tags فشل ($LASTEXITCODE)" }
          git describe --tags --exact-match HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::لا وسم على HEAD — سيكتب build-info.json الوسم null مع سببه" }
          pnpm build:info
          if ($LASTEXITCODE -ne 0) { throw "pnpm build:info فشل ($LASTEXITCODE)" }
          foreach ($f in @('dist/release-metadata/build-info.json', 'dist/release-metadata/sbom.cdx.json')) {
            if (-not (Test-Path $f)) { throw "$f لم يُكتب — والإسناد الناقص هو عطل 0.2.8 نفسه" }
          }
          Write-Host "✓ إسناد الإصدار جاهز للوسم $tag"

      - name: Publish release assets (SHA256SUMS.txt · build-info.json · sbom.cdx.json)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          # البصمات تُحسب من الأصول **المنزَّلة من النشرة** لا من مخرجات البناء المحلي:
          # فخّ 0.2.5 المقيس — بصمات بناء محلي لأصول منشورة غيره تُبطل كل «تطابقت ثلاثاً».
          $rel = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY --pattern '*.exe' --pattern '*.msi' --dir $rel --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download فشل ($LASTEXITCODE) — فالبصمات لن تصف الأصول المنشورة" }
          $lines = Get-ChildItem $rel -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          if (@($lines).Count -lt 2) { throw "أصول أقل من اثنين في $rel — لا بصمات لنشر ناقص" }
          Set-Content (Join-Path $rel 'SHA256SUMS.txt') -Value $lines -Encoding utf8NoBOM
          gh release upload $tag -R $env:GITHUB_REPOSITORY (Join-Path $rel 'SHA256SUMS.txt') 'dist/release-metadata/build-info.json' 'dist/release-metadata/sbom.cdx.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload فشل ($LASTEXITCODE) — النشرة ناقصة ولا يجوز أن يمرّ السير" }
          Write-Host "✓ ثلاثة أصول إسناد مرفوعة إلى $tag (SHA256SUMS.txt · build-info.json · sbom.cdx.json)"

      - name: Publish self-repair assets (assets-v1, idempotent)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2026-09-15 (ب.١ · ب.٤.أ): the bundled ffmpeg/ffprobe are now the
          # LGPL build, and they are published under license-stating asset names
          # (ffmpeg-lgpl.exe / ffprobe-lgpl.exe) — NEVER under the old
          # `ffmpeg.exe`/`ffprobe.exe` names, which a published 0.2.4 client
          # still verifies against its embedded GPL hash. A --clobber upload on
          # those old names would silently break self-repair for every installed
          # 0.2.4 (it would download fine and then fail the hash check).
          # Keep these names in sync with src-tauri/src/repair.rs COMPONENTS
          # (`asset` = remote name, `local` = installed name).
          $stage = Join-Path $env:RUNNER_TEMP 'repair-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'bin/ffmpeg.exe'  (Join-Path $stage 'ffmpeg-lgpl.exe')  -Force
          Copy-Item 'bin/ffprobe.exe' (Join-Path $stage 'ffprobe-lgpl.exe') -Force
          $files = @(
            (Join-Path $stage 'ffmpeg-lgpl.exe'),
            (Join-Path $stage 'ffprobe-lgpl.exe'),
            'bin/yt-dlp.exe',
            'models/UVR-MDX-NET-Voc_FT.onnx'
          )
          if (-not (gh release view assets-v1 --json tagName -q .tagName 2>$null)) {
            gh release create assets-v1 $files --title "Repair assets (stable)" --notes "مصادر معالج الإصلاح الذاتي — لا تحذف هذا الإصدار."
          } else {
            # Audit 2026-09-15 (٧.أ): «create-or-skip» كان يعني أن إعادة تشغيل
            # السير لا ترفع شيئاً أبداً — أي أصل ناقص أو تالف يبقى ناقصاً/تالفاً
            # إلى الأبد. الرفع الآن بـ --clobber: يستبدل الموجود ويضيف الناقص،
            # والسير يبقى قابلاً لإعادة التشغيل (المعرّف نفسه، لا إصدار جديد).
            gh release upload assets-v1 $files --clobber
          }
      # NOTE: CUDA runtime assets are published by the standalone workflow
      # `.github/workflows/cuda-assets.yml` (workflow_dispatch, GITHUB_TOKEN
      # only) — independent of this release's signing secrets.
