name: Publish CUDA runtime assets

# CUDA_RUNTIME_PLAN — publishes the sixteen CUDA runtime DLLs + their
# self-describing manifest to the assets-v1 release, so the app's one-click
# self-download works. Runs with ONLY the auto-provided GITHUB_TOKEN —
# deliberately independent of the release workflow's signing secrets, so it
# can be run at any time from the Actions tab.
#
# The list MUST stay byte-identical to `CUDA_FILES` in
# `src-tauri/src/cuda_runtime.rs` (the app rejects a manifest missing any name),
# AND the assembled bytes MUST match `CUDA_FILE_SHA256` in the same file — which
# is why this job now checks the repo out and compares hashes before uploading.
# Bump versions here together with the ort crate.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # The repo is needed for ONE thing: the pinned hash table
      # (`CUDA_FILE_SHA256`) that the shipped app verifies every downloaded file
      # against. It is read from source rather than duplicated here, so it can
      # never drift from what clients enforce.
      - name: Checkout (for the pinned CUDA hash table)
        uses: actions/checkout@v4

      - name: Assemble CUDA runtime (CUDA libs + full cuDNN + ORT bridge)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pinned to match the ORT build bundled in the app (CUDA 12.x / cuDNN 9.x / ORT 1.22.0)
          $CUDA_VER  = '12.8.2'
          $CUDNN_VER = '9.12.0'   # bump together with the ort crate if needed
          $ORT_VER   = '1.22.0'   # MUST match the ort crate's ONNXRUNTIME_VERSION
          $work = Join-Path $env:RUNNER_TEMP 'cuda-runtime'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $bin = Join-Path $work 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # 1) CUDA redist (cudart + cublas/cublasLt) — components keyed
          #    cuda_cudart / libcublas, each with windows-x86_64.relative_path
          $cu = Invoke-RestMethod "https://developer.download.nvidia.com/compute/cuda/redist/redistrib_$CUDA_VER.json"
          # libcufft is REQUIRED: the ORT CUDA provider loads cufft64_11.dll directly,
          # and the app refuses a manifest that lacks any CUDA_FILES name. It was
          # missing from this list from the start (the audit log claimed otherwise),
          # so running this workflow published a 15-file manifest that every install
          # rejects — verified against the live release on 2026-09-14.
          foreach ($part in @('cuda_cudart','libcublas','libcufft')) {
            $meta = $cu.$part
            if (-not $meta) { throw "redistrib_$CUDA_VER.json missing $part" }
            $win = $meta.'windows-x86_64'
            if (-not $win) { throw "$part has no windows-x86_64 entry" }
            $zip = Join-Path $work "$part.zip"
            Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/redist/$($win.relative_path)" -OutFile $zip
            $ex = Join-Path $work $part
            Expand-Archive $zip -DestinationPath $ex -Force
            $wanted = if ($part -eq 'cuda_cudart') { @('cudart64_12.dll') }
                      elseif ($part -eq 'libcublas') { @('cublas64_12.dll','cublasLt64_12.dll') }
                      else { @('cufft64_11.dll') }
            foreach ($dll in $wanted) {
              $src = Get-ChildItem $ex -Recurse -Filter $dll | Select-Object -First 1
              if (-not $src) { throw "$part zip missing $dll — wrong version or layout" }
              Copy-Item $src.FullName (Join-Path $bin $dll)
            }
          }

          # 2) cuDNN redist zip — windows entry is keyed by cuda variant.
          #    Ship the FULL set: a missing piece (once: cudnn_graph) fails
          #    provider init with a native crash, not a clean error.
          $cd = Invoke-RestMethod "https://developer.download.nvidia.com/compute/cudnn/redist/redistrib_$CUDNN_VER.json"
          $win = $cd.cudnn.'windows-x86_64'
          if (-not $win) { throw "redistrib_$CUDNN_VER.json missing cudnn windows entry" }
          $c12 = $win.cuda12
          if (-not $c12) { throw "cudnn windows entry missing cuda12 variant" }
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cudnn/redist/$($c12.relative_path)" -OutFile (Join-Path $work 'cudnn.zip')
          Expand-Archive (Join-Path $work 'cudnn.zip') -DestinationPath (Join-Path $work 'cudnn') -Force
          foreach ($dll in @('cudnn64_9.dll','cudnn_ops64_9.dll','cudnn_cnn64_9.dll','cudnn_adv64_9.dll','cudnn_graph64_9.dll','cudnn_heuristic64_9.dll','cudnn_engines_precompiled64_9.dll','cudnn_engines_runtime_compiled64_9.dll','cudnn_engines_tensor_ir64_9.dll','cudnn_ext64_9.dll')) {
            $src = Get-ChildItem (Join-Path $work 'cudnn') -Recurse -Filter $dll | Select-Object -First 1
            if (-not $src) { throw "cuDNN zip missing $dll — wrong version or layout" }
            Copy-Item $src.FullName (Join-Path $bin $dll)
          }

          # 3) ORT provider bridge — the crate links the core statically but
          #    loads THESE two at runtime, exact-version matched. The crate's
          #    own build only leaves 0-byte linker stubs, so take the genuine
          #    binaries from the official release of the same ORT version.
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VER/onnxruntime-win-x64-gpu-$ORT_VER.zip" -OutFile (Join-Path $work 'ort-gpu.zip')
          Expand-Archive (Join-Path $work 'ort-gpu.zip') -DestinationPath (Join-Path $work 'ort') -Force
          foreach ($dll in @('onnxruntime_providers_shared.dll','onnxruntime_providers_cuda.dll')) {
            $src = Get-ChildItem (Join-Path $work 'ort') -Recurse -Filter $dll | Select-Object -First 1
            if (-not $src) { throw "ORT gpu zip missing $dll" }
            # لا فحص حجم هنا بعد الآن: الحارس المفرد أدناه (قبل المانيفست) يمرّ
            # على **كل** ملف في bin/ بقاعدة واحدة. الشرط القديم كان يستثني
            # onnxruntime_providers_shared.dll بالاسم، فبقي الملف الوحيد في
            # المجموعة بلا أي فحص — وهو بالضبط ما ينبغي أن يراه الحارس.
            Copy-Item $src.FullName (Join-Path $bin $dll)
          }

          # 3ب) حارس السلامة: كل ملف في bin/ يجب أن يكون PE **كاملاً**.
          #     دمية الربط التي يتركها ort وحده 0 بايت، والتنزيل المنقطع ملف
          #     أقصر مما تعلنه رؤوسه — والقاعدة الواحدة تمسك الاثنين، فلا حاجة
          #     إلى استثناء اسم بعينه (وقد كان الاستثناء هو العيب).
          # >>> CUDA_ASSET_GUARD:BEGIN
          function Test-CompletePe {
            param([Parameter(Mandatory)][System.IO.FileInfo]$File)
            $len = $File.Length
            if ($len -lt 512) { throw "✗ $($File.Name): $len bytes — أصغر من رأس PE (دمية ربط فارغة؟)" }
            $head = [byte[]]::new([int][Math]::Min($len, 65536))
            $fs = [System.IO.File]::OpenRead($File.FullName)
            try { $null = $fs.Read($head, 0, $head.Length) } finally { $fs.Dispose() }
            if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "✗ $($File.Name): ليس PE (لا يبدأ بـ MZ)" }
            $pe = [BitConverter]::ToInt32($head, 0x3C)
            if ($pe -lt 64 -or $pe + 24 -gt $head.Length) { throw "✗ $($File.Name): رأس PE خارج ما قُرئ" }
            if ([BitConverter]::ToUInt32($head, $pe) -ne 0x00004550) { throw "✗ $($File.Name): توقيع PE خاطئ" }
            $coff = $pe + 4
            $nsec = [BitConverter]::ToUInt16($head, $coff + 2)
            $optsz = [BitConverter]::ToUInt16($head, $coff + 16)
            if ($nsec -lt 1) { throw "✗ $($File.Name): بلا أقسام" }
            $opt = $coff + 20
            $need = [int64][Math]::Max([int][BitConverter]::ToUInt32($head, $opt + 60), 512)
            for ($i = 0; $i -lt $nsec; $i++) {
              $sec = $opt + $optsz + ($i * 40)
              if ($sec + 40 -gt $head.Length) { throw "✗ $($File.Name): جدول الأقسام خارج ما قُرئ" }
              $rawSz = [BitConverter]::ToUInt32($head, $sec + 16)
              $rawPtr = [BitConverter]::ToUInt32($head, $sec + 20)
              $end = [int64]$rawPtr + [int64]$rawSz
              if ($end -gt $need) { $need = $end }
            }
            if ($len -lt $need) { throw "✗ $($File.Name): مبتور — $len bytes والرؤوس تعلن $need" }
            Write-Host "  ✓ $($File.Name) كامل ($len bytes)"
          }

          # وكل ملف يجب أن يمرّ — وقائمة فارغة **فشل** لا نجاح: حارس لم يرَ
          # شيئاً لا يُثبت شيئاً.
          $dlls = @(Get-ChildItem $bin -Filter '*.dll' | Sort-Object Name)
          if ($dlls.Count -eq 0) { throw "✗ لا ملفات DLL في $bin — لا شيء يُفحص، فلا نجاح" }
          foreach ($f in $dlls) { Test-CompletePe -File $f }
          Write-Host "✓ كل ملفات bin سليمة: $($dlls.Count)"
          # <<< CUDA_ASSET_GUARD:END

          # 4) self-describing manifest (name + sha256 per file)
          $manifest = [ordered]@{ files = @() }
          foreach ($f in Get-ChildItem $bin -Filter '*.dll' | Sort-Object Name) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest.files += [ordered]@{ name = $f.Name; sha256 = $hash }
          }
          # 4ب) Drift guard: the app requires EXACTLY these names (CUDA_FILES in
          #     src-tauri/src/cuda_runtime.rs). The NAME list stays duplicated here
          #     because this step must fail before publishing a manifest the app
          #     rejects ("ينقص المنفست: …"); `check-cuda-assets.cjs` keeps this list
          #     and CUDA_FILES byte-identical. The HASH table is NOT duplicated —
          #     the step below reads CUDA_FILE_SHA256 from the checked-out source.
          $EXPECTED = @(
            'cudart64_12.dll','cublas64_12.dll','cublasLt64_12.dll','cufft64_11.dll',
            'cudnn64_9.dll','cudnn_ops64_9.dll','cudnn_cnn64_9.dll','cudnn_adv64_9.dll',
            'cudnn_graph64_9.dll','cudnn_heuristic64_9.dll','cudnn_engines_precompiled64_9.dll',
            'cudnn_engines_runtime_compiled64_9.dll','cudnn_engines_tensor_ir64_9.dll',
            'cudnn_ext64_9.dll','onnxruntime_providers_shared.dll','onnxruntime_providers_cuda.dll'
          )
          $have = @($manifest.files | ForEach-Object { $_.name })
          $missing = @($EXPECTED | Where-Object { $have -notcontains $_ })
          $extra = @($have | Where-Object { $EXPECTED -notcontains $_ })
          if ($missing.Count -or $extra.Count) {
            throw "manifest drift — missing: [$($missing -join ', ')] · extra: [$($extra -join ', ')] — update this list AND CUDA_FILES together"
          }
          Write-Host "manifest guard passed: $($have.Count) files == CUDA_FILES"

          $manifestPath = Join-Path $work 'cuda-runtime-manifest.json'
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path $manifestPath -Encoding utf8NoBOM

          Write-Host "assembled $(@($manifest.files).Count) CUDA runtime files"
          Get-Content $manifestPath

      # ── حارس انحراف البصمات (pinned SHA-256 drift) ─────────────────────────
      # لماذا وُلد: التطبيق **لا يقرأ بصمات المانيفست إطلاقاً** — المرجع عنده
      # `CUDA_FILE_SHA256` المثبَّتة في التنفيذي، فلا يقبل إلا تلك البايتات بعينها.
      # وإعادة التجميع من مصادر NVIDIA لا تضمنها: **NVIDIA غيّرت أرشيف cuDNN 9.12.0
      # (‏9.12.0.46 · cuda12) فلم يبقَ يوفّر `cudnn_engines_tensor_ir64_9.dll`**، فسقط
      # التشغيل 35671165633 في خطوة التجميع («cuDNN zip missing …»)، ورُفعت المجموعة
      # المتحقَّق منها على الجهاز يدوياً. **والخطر الباقي أسوأ من السقوط**: مجموعة
      # تُجمَّع من أرشيف متغيّر ثم تُرفع، فيبقى الإصدار «منشوراً» وكل عميل يرفض
      # بايتاتها عند التحقق ⇒ زرّ CUDA معطّل بصمت بلا أن يسقط شيء.
      # فهذا الحارس يقارن **بصمة كل ملف** بالجدول المستخرج من المصدر، ويسقط السير
      # بصوت عالٍ **قبل الرفع** — بدل أن ينشر مجموعة لا يقبلها أي عميل.
      # (‏والحادث موثَّق في docs/AUDIT.md — 2026-09-22. والنصّ نفسه يُقاس محلياً
      # بنصّه المشحون عبر `node scripts/check-release-assets.cjs --selfcheck`.)
      - name: Guard — assembled bytes must match the app's pinned SHA-256 table
        shell: pwsh
        run: |
          # >>> CUDA_SHA_GUARD:BEGIN
          # الإخراج UTF-8 صراحةً: بلا هذين السطرين ترمّز pwsh العربية إلى '؟' في السجلّ.
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = 'Stop'

          # المرجع: الجدول المثبَّت في التنفيذي — من المصدر، ولا نسخة ثانية هنا.
          $rs = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/src/cuda_runtime.rs'
          if (-not (Test-Path $rs)) { throw "✗ لا $rs — بلا جدول البصمات لا مرجع أقيس به، فلا نجاح" }
          $src = Get-Content $rs -Raw
          $m = [regex]::Match($src, 'pub const CUDA_FILE_SHA256[^=]*=\s*&\[(?s)(.*?)\r?\n\];')
          if (-not $m.Success) { throw '✗ لم أقرأ CUDA_FILE_SHA256 من المصدر — تغيّر اسم الثابت أو شكله؟' }

          $pinned = [ordered]@{}
          foreach ($p in [regex]::Matches($m.Groups[1].Value, '\(\s*"([^"]+)"\s*,\s*"([0-9a-fA-F]{64})"\s*,?\s*\)')) {
            $pinned[$p.Groups[1].Value] = $p.Groups[2].Value.ToLowerInvariant()
          }
          if ($pinned.Count -eq 0) { throw '✗ جدول CUDA_FILE_SHA256 فارغ — لا بصمة أقيس بها، فلا نجاح' }

          $bin = Join-Path (Join-Path $env:RUNNER_TEMP 'cuda-runtime') 'bin'
          $dlls = @(Get-ChildItem $bin -Filter '*.dll' | Sort-Object Name)
          if ($dlls.Count -eq 0) { throw "✗ لا DLL في $bin — لا شيء يُقاس، فلا نجاح" }

          $bad = @()
          foreach ($f in $dlls) {
            $want = $pinned[$f.Name]
            if (-not $want) { $bad += "$($f.Name): ليس في جدول البصمات المثبَّتة"; continue }
            $got = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -eq $want) { Write-Host "  ✓ $($f.Name)" } else { $bad += "$($f.Name): المقروء $got ≠ المثبَّت $want" }
          }
          # والاتجاه الآخر: كل بصمة مثبَّتة يجب أن يكون لها ملف — وإلا فالتطبيق
          # يطلب ملفاً لا يُرفع، وهو عطل «القناة ناقصة» نفسه من جهة أخرى.
          $have = @($dlls | ForEach-Object { $_.Name })
          foreach ($n in @($pinned.Keys)) {
            if ($have -notcontains $n) { $bad += "${n}: بصمة مثبَّتة في التطبيق ولا ملف له في bin/" }
          }
          if ($bad.Count) {
            Write-Host '✗ انحراف بصمات — لا يُرفع شيء:'
            foreach ($b in $bad) { Write-Host "   - $b" }
            throw "✗ انحراف بصمات CUDA: $($bad.Count) موضعاً — مجموعة يرفضها كل عميل لن تُنشر"
          }
          Write-Host "✓ بصمات CUDA مطابقة تماماً للمثبَّتة في التطبيق: $($dlls.Count) ملفاً"
          # <<< CUDA_SHA_GUARD:END

      - name: Upload to assets-v1 (create if missing)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # **كل أمر له فحص رمز خروج صريح** (دَين 0.2.8: خطوة pwsh «تنجح» وإن فشل أمرها،
          # فيُعلَن الرفع تامّاً والقناة ناقصة ⇒ روابط 404 لكل مستخدم مثبَّت).
          $ErrorActionPreference = 'Stop'
          function Assert-Ok([string]$what) {
            if ($LASTEXITCODE -ne 0) { throw "$what فشل برمز $LASTEXITCODE" }
          }
          $work = Join-Path $env:RUNNER_TEMP 'cuda-runtime'
          $repo = 'SMSMy/HaramLite'  # -R: this job has no checkout, so gh needs the repo explicitly

          # وجود القناة يُقاس برمز الخروج لا بصدق المخرَج: «فشل gh» (شبكة/توكن) ليس «القناة غائبة»،
          # ولو خلطنا بينهما لأنشأنا إصداراً جديداً على عطل عابر.
          $null = gh release view assets-v1 -R $repo --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'assets-v1 موجودة — يُرفع فوقها بـ--clobber'
          } elseif ($LASTEXITCODE -eq 1) {
            Write-Host 'assets-v1 غير موجودة — تُنشأ الآن'
            gh release create assets-v1 -R $repo --title "Repair assets (stable)" --notes "مصادر معالج الإصلاح الذاتي — لا تحذف هذا الإصدار. الرخص: رخصة NVIDIA CUDA (البند 1.1.2 Distribution Requirements) لأصول CUDA/cuDNN، و MIT لمزوّدي ONNX Runtime — والتفاصيل في THIRD-PARTY-NOTICES.md في المستودع."
            Assert-Ok 'إنشاء القناة'
          } else {
            throw "gh release view فشل برمز $LASTEXITCODE — لا نُفرّق بين «غائبة» و«عطل» فلا نُنشئ شيئاً"
          }

          $payload = @(Get-ChildItem (Join-Path $work 'bin') -Filter '*.dll').FullName + (Join-Path $work 'cuda-runtime-manifest.json')
          gh release upload assets-v1 -R $repo @payload --clobber
          Assert-Ok 'رفع الأصول'

          # **والتحقّق بعد الرفع**: القناة تُقرأ من الشبكة وتُقابَل بما رُفع، فلا يُعلَن نجاحٌ بلا أثر.
          $expected = @($payload | ForEach-Object { Split-Path $_ -Leaf }) | Sort-Object -Unique
          $have = @((gh release view assets-v1 -R $repo --json assets -q '.assets[].name') -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() })
          Assert-Ok 'قراءة القناة بعد الرفع'
          $missing = @($expected | Where-Object { $have -notcontains $_ })
          if ($missing.Count) { throw "بعد الرفع: أصول غائبة عن القناة: $($missing -join ', ')" }
          Write-Host "تحقّق الرفع: $($have.Count) أصلاً في assets-v1 — وكل المرفوع حاضر"
