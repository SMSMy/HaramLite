<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left waveform (audio before the cut) -->
  <rect x="1" y="8" width="2" height="8" rx="1" fill="currentColor"/>
  <rect x="4" y="5" width="2" height="14" rx="1" fill="currentColor"/>

  <!-- Right waveform (audio after the cut) -->
  <rect x="18" y="5" width="2" height="14" rx="1" fill="currentColor"/>
  <rect x="21" y="8" width="2" height="8" rx="1" fill="currentColor"/>

  <!-- Two solid triangles pointing at each other: the silence gap collapsing shut -->
  <polygon points="8,7 8,17 12.5,12" fill="currentColor"/>
  <polygon points="16,7 16,17 11.5,12" fill="currentColor"/>
</svg>
