# إعداد موقع النشر (GitHub Pages) — جذر الموقع هو هذا المجلد.
#
# لماذا هنا: ملف إثبات ملكية قوقل يجب أن يُقدَّم على جذر موقع **تملكه**.
# رابط المستودع (github.com/SMSMy/HaramLite/…) لا يخدم الملفات على مسار الجذر
# أصلاً، فالإثبات كان يفشل بـ404. GitHub Pages يحلّ ذلك، ويعطينا أيضاً رابط
# سياسة خصوصية حقيقياً يحتاجه متجر كروم.

title: HaramLite
description: إزالة الموسيقى من الفيديو — معالجة محلية 100% على جهازك
theme: jekyll-theme-cayman

# لا نُخرج الوثائق الداخلية كصفحات موقع. مُستثنى = لا يُنسخ إلى _site.
# ملاحظة: ملف إثبات قوقل **ليس** مستثنى — يجب أن يبقى مُخدَماً على الجذر.
exclude:
  - AUDIT.md
  - STORE.md
  - FUNCTIONAL_AUDIT.md
  - CUDA_RUNTIME_PLAN.md
  - CONTRIBUTING.md
  - RELEASE-0.2.1.md
  - rebuild/

# ملاحظة: عند ربط الدومين المخصص أضف ملف CNAME يحوي haramlite.com في هذا المجلد،
# ولا تفعله قبل أن تشير سجلات DNS إلى GitHub وإلا انكسر الموقع مؤقتاً.
