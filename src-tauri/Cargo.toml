[package]
name = "haramlite-rs"
version = "0.2.6"
description = "HaramLite — lightweight AI music removal (Rust/Tauri)"
authors = ["HaramMute"]
edition = "2021"

[lib]
name = "haramlite_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# و-١: يمنح ثنائي اختبار المكتبة وحده `tauri::test::mock_app`، فيُختبر نطاق
# بروتوكول الأصول فعلياً (`Scope::is_allowed`) بدل الادّعاء. الإنتاج لا يتغيّر:
# `cfg(any(test, feature = "test"))` في tauri لا تُفعَّل في بناء الإصدار.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
ort = { version = "=2.0.0-rc.10", features = ["directml", "cuda"] }
rustfft = "6"
hound = "3"
rayon = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# OS entropy for the Telegram pairing code (و-٧): `std`'s `RandomState` is
# seeded for hash-flooding resistance, NOT as a secret. Already in the tree
# (0.3.4 pulled by tauri's uuid chain), so this adds no new crate family —
# the lockfile only gains the direct edge.
getrandom = "0.3"
dirs = "5.0"
notify = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[[bin]]
name = "HaramLite"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# Win32_UI_WindowsAndMessaging (0.2.6، تكملة و-٤): صندوق `MessageBoxW` الذي
# يقول «نسخة أخرى تعمل» في لحظة تسبق بناء تطبيق Tauri كله — لا نافذة ولا سجل.
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
