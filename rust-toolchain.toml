# سلسلة أدوات مثبَّتة — **مصدر واحد** يقرأه CI والمطوّر المحلي معاً.
#
# **لماذا التثبيت، مقيساً (2026-10-03)**: `qa/rust-baselines.json` قِيس محلياً بـ
# `cargo 1.95.0 (f2d3ce0bd 2026-03-21)` و`clippy 0.1.95 (59807616e1 2026-04-14)`
# ويثبّت رقمين: **١٤ موضع clippy فريداً** و**٤٤٧ اختباراً ناجحاً** بأسمائها.
# وكان `ci.yml` يستعمل `dtolnay/rust-toolchain@stable` **بلا تثبيت** فنصّب
# `rustc 1.99.0 (b940084d7 2026-09-28)` (مقروء من سجلّ التشغيل `37143515832`)،
# فصار يطبع **`✗ تحذيرات clippy: 15 موضعاً فريداً > الأساس 14`**.
#
# ⇒ **أساسٌ يُقاس بأداة عائمة ليس أساساً**: البوّابة كانت تقارن رقم أداة برقم أداة
# أخرى، فتُسقط **كل** دفعة عند خطوة `Rust baseline gate` — حتى دفعة **لا تحوي
# ملفاً واحداً خارج `docs/`** (‏`c0bf651`: صفر ملف، وسقط). وحمراءُ دائماً لا تُقرأ.
#
# **والقرار**: تثبيت الأداة على **ما قِيس به الأساس**، لا رفع الأساس ليطابق أداة
# عائمة — لأن الثاني **تقنينٌ للتقادم**. وفي هذا الجهاز `stable` **هو** 1.95.0
# (مقيس: `rustc 1.95.0 (59807616e 2026-04-14)`)، فالتثبيت **لا يغيّر بناءً محلياً**
# بل يمنع انزياحه، ويثبّت CI على نفس الرقم.
#
# **وحدّ مُعلَن**: عند تغيير هذا الرقم لاحقاً يجب **إعادة قياس** خطّ الأساس
# (`pnpm rust:gates --update`) في نفس العمل — وإلا عاد الصنف نفسه.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc"]
profile = "minimal"
